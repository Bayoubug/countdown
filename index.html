<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown</title>
<!--
  COUNTDOWN OVERLAY
  Shows only the number of days until a date. The background is see-through.

  Add the date to the end of the web address:
    ?date=12-25          every year (Christmas)
    ?date=easter         Easter Sunday, figured out every year
    ?date=2027-06-14     a one-time date (shows 0 after it passes)

  Optional extras, joined with &:
    &color=gold          any color name, or a code like ffd700 (no # sign)
    &font=Playfair+Display   any free Google Font, spaces become +

  Example:  ?date=12-25&color=gold&font=Playfair+Display
-->
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #n {
    color: #ffffff;
    font-family: 'Montserrat', Arial, Helvetica, sans-serif;
    font-weight: 800;
    font-size: 80vh;
    font-size: min(80vh, 45vw);
    line-height: 1;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<div id="n"></div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var el = document.getElementById('n');

  // ---- Font ----
  function loadFont(spec) {
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=' + spec + '&display=block';
    document.head.appendChild(link);
  }
  var font = (params.get('font') || '').trim();
  if (font) {
    var spec = encodeURIComponent(font).replace(/%20/g, '+');
    loadFont(spec);                  // regular weight (every font has it)
    loadFont(spec + ':wght@700');    // bold, if the font offers it
    el.style.fontFamily = "'" + font.replace(/'/g, '') + "', Arial, Helvetica, sans-serif";
    el.style.fontWeight = '700';
  } else {
    loadFont('Montserrat:wght@800');
  }

  // ---- Color ----
  var color = (params.get('color') || '').trim();
  if (color) {
    if (/^[0-9a-f]{3}([0-9a-f]{3})?([0-9a-f]{2})?$/i.test(color)) color = '#' + color;
    el.style.color = color;
  }

  // ---- Date math ----
  function midnight(y, m, d) { return new Date(y, m - 1, d); }
  function isReal(y, m, d) {
    var t = midnight(y, m, d);
    return t.getFullYear() === y && t.getMonth() === m - 1 && t.getDate() === d;
  }
  function easter(y) {
    var a = y % 19, b = Math.floor(y / 100), c = y % 100,
        d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
        g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
        i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7,
        m = Math.floor((a + 11 * h + 22 * l) / 451),
        month = Math.floor((h + l - 7 * m + 114) / 31),
        day = ((h + l - 7 * m + 114) % 31) + 1;
    return midnight(y, month, day);
  }
  function yearly(y, m, d) {           // Feb 29 falls back to Feb 28 in other years
    if (m === 2 && d === 29 && !isReal(y, 2, 29)) d = 28;
    return midnight(y, m, d);
  }

  function daysLeft(spec, now) {
    var today = midnight(now.getFullYear(), now.getMonth() + 1, now.getDate());
    var year = today.getFullYear();
    var target, match;
    spec = (spec || '').trim().toLowerCase();

    if (spec === 'easter') {
      target = easter(year);
      if (target < today) target = easter(year + 1);
    } else if ((match = spec.match(/^(\d{1,2})-(\d{1,2})$/))) {
      var m = +match[1], d = +match[2];
      if (!isReal(2024, m, d)) return null;            // 2024 is a leap year, so 02-29 is allowed
      target = yearly(year, m, d);
      if (target < today) target = yearly(year + 1, m, d);
    } else if ((match = spec.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) {
      var Y = +match[1], M = +match[2], D = +match[3];
      if (!isReal(Y, M, D)) return null;
      target = midnight(Y, M, D);
    } else {
      return null;
    }
    var days = Math.round((target - today) / 86400000);   // rounding absorbs daylight-saving shifts
    return days < 0 ? 0 : days;
  }

  // Exposed for testing only
  window.__daysLeft = daysLeft;

  function update() {
    var days = daysLeft(params.get('date'), new Date());
    el.textContent = days === null ? '?' : String(days);
  }

  update();
  setInterval(update, 60 * 1000);   // re-check every minute so it flips right at midnight
})();
</script>
</body>
</html>
